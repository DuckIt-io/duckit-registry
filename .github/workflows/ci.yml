name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,json,md}"

      - name: Generate registry
        run: npm -w @duckit/cli run generate-registry

      - name: Check registry is up to date
        run: |
          if [ -n "$(git status --porcelain registry/)" ]; then
            echo "❌ Registry is not up to date. Run 'npm run generate-registry' and commit the changes."
            git status --porcelain registry/
            git diff registry/
            exit 1
          fi
          echo "✅ Registry is up to date"
