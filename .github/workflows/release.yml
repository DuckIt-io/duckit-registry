name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Generate registry
        run: npm -w @duckit/cli run generate-registry

      - name: Build CLI
        run: npm run build

      - name: Publish @duckit/registry
        run: |
          CURRENT=$(node -p "require('./registry/package.json').version")
          LATEST=$(npm view @duckit/registry version 2>/dev/null || echo "none")
          if [ "$CURRENT" != "$LATEST" ]; then
            cd registry && npm publish --access public
            echo "✅ @duckit/registry@$CURRENT published"
          else
            echo "⏭️ @duckit/registry@$CURRENT already published"
          fi

      - name: Publish @duckit/cli
        run: |
          CURRENT=$(node -p "require('./packages/cli/package.json').version")
          LATEST=$(npm view @duckit/cli version 2>/dev/null || echo "none")
          if [ "$CURRENT" != "$LATEST" ]; then
            cd packages/cli && npm publish --access public
            echo "✅ @duckit/cli@$CURRENT published"
          else
            echo "⏭️ @duckit/cli@$CURRENT already published"
          fi

      - name: Publish duckit alias
        run: |
          CURRENT=$(node -p "require('./packages/duckit/package.json').version")
          LATEST=$(npm view duckit version 2>/dev/null || echo "none")
          if [ "$CURRENT" != "$LATEST" ]; then
            cd packages/duckit && npm publish --access public
            echo "✅ duckit@$CURRENT published"
          else
            echo "⏭️ duckit@$CURRENT already published"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
